# Gozaride Nginx Configuration with Load Balancing
# This config supports load balancing across multiple app instances
# and handles SSL termination at the edge

# ===== GLOBAL SETTINGS =====
user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
}

# http block
http {
    
    # ===== LOGGING =====
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ===== MIME TYPES =====
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===== ACCESS LOGGING =====
    access_log off;

    # ===== SENDFILE OPTIMIZATION =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_header_names X-Requested-With;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/html;

    # ===== SSL SESSION CACHING =====
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===== VERSON HEADERS =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ===== UPSTREAM SERVERS (LOAD BALANCING) =====
    
    # Primary app server instance
    upstream gozaride_app_1 {
        server 127.0.0.1:3000 weight=3;
        keepalive 32;
    }
    
    # Secondary app server instance for load balancing
    upstream gozaride_app_2 {
        server 192.168.1.100:3000 weight=2;
        keepalive 16;
    }
    
    # Combined upstream with fallback
    upstream gozaride_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        server 192.168.1.101:3000 max_fails=3 fail_timeout=30s backup;
    }

    # ===== GZARIDE SERVER BLOCK =====
    server {
        listen 80;
        listen [::]:80;
        
        # ===== DOMAIN NAME =====
        server_name gozaride.com www.gozaride.com;
        
        # ===== HTTP TO HTTPS REDIRECT =====
        return 301 https://$host$request_uri;
    }
    
    # ===== HTTPS SERVER WITH LOAD BALANCING =====
    server {
        listen 443 ssl http2;
        create listen [::]:443 ssl http2;
        
        # ===== SSL CONFIGURATION =====
        ssl_certificate /etc/nginx/ssl/gozaride.com.crt;
        ssl_certificate_key /etc/nginx/ssl/gozaride.com.key;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache $ssl_session_cache;
        ssl_session_timeout 1d;
        
        # ===== SSL HARDENING =====
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        ssl_stapling_timeout 30s;
        resolver_timeout 5s;
        
        # ===== HOSTNAME =====
        server_name gozaride.com www.gozaride.com;
        
        # ===== REQUEST LIMITS =====
        client_max_body_size 50M;
        client_body_buffer_size 128k;
        
        # ===== ROUTING =====
        
        # ===== APPLICATION SERVER (Load Balanced) =====
        location / {
            proxy_pass http://gozaride_backend;
            
            # ===== PROXY SETTINGS =====
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_update;
            
            # ===== TIMEOUTS =====
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
            proxy_next_upstream error timeout timeout error;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries 3;
            
            # ===== CACHING =====
            proxy_cache gozaride_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid any 30s;
            add_header X-Cache $upstream_cache_status;
            
            # ===== WEB SOCKET SUPPORT =====
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # ===== API ENDPOINTS =====
        location /api/ {
            proxy_pass http://gozaride_backend;
            
            # ===== PROXY SETTINGS =====
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            
            # ===== TIMEOUTS =====
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # ===== CORS HEADERS =====
            add_header 'Access-Control-Allow-Origin' 'https://gozaride.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-None-Match,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # ===== CORS PREFLIGHT =====
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Max-Age' '1728000';
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' '0';
                proxy_pass https://gozaride_backend;
                break;
            }
            
            # ===== CORS PREFLIGHT TIMEOUT =====
            if ($request_method = 'OPTIONS') {
                proxy_pass http://gozaride_backend;
                break;
            }
        }
        
        # ===== STATIC ASSETS =====
        location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|json|css|js|webm|mp4|ogg|mp3|avi)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
            access_log off;
            expires_vary off;
        }
        
        # ===== NEXT.JS INTERNAL ENDPOINTS =====
        location ~ /_next {
            proxy_pass http://gozaride_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache gozaride_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
        }
        
        # ===== ROBOTS.TXT =====
        location /robots.txt {
            proxy_pass http://gozaride_backend;
            access_log off;
            add_header Content-Type "text/plain";
        }
        
        # ===== WELL-KNOWN =====
        location /well-known/ {
            proxy_pass http://gozaride_backend;
        }
        
        # ===== STATUS PAGE =====
        location /status {
            stub_status;
            access_log off;
        }
        
        # ===== ERROR PAGES =====
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # ===== REAL IP MODULE =====
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
}