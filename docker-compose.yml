version: '3.8'

services:
  # ===== NGINX LOAD BALANCER =====
  nginx:
    image: nginx:alpine
    container_name: gozaride-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app1
      - app2
    networks:
      - gozaride_net

  # ===== APPLICATION SERVER 1 =====
  app1:
    build: .
    container_name: gozaride-app1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gozaride:password@db:5432/gozaride
      - NEXTAUTH_URL=https://gozaride.com
      - NEXTAUTH_SECRET=change-this-to-a-secure-random-string
    env_file:
      - .env.production
    working_dir: /app
    command: npm start
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gozaride_net

  # ===== APPLICATION SERVER 2 =====
  app2:
    build: .
    container_name: gozaride-app2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gozaride:password@db:5432/gozaride
      - NEXTAUTH_URL=https://gozaride.com
      - NEXTAUTH_SECRET=change-this-to-a-secure-random-string
    env_file:
      - .env.production
    working_dir: /app
    command: npm start
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gozaride_net

  # ===== DATABASE =====
  db:
    image: postgres:15-alpine
    container_name: gozaride-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gozaride
      POSTGRES_USER: gozaride
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - gozaride_net

  # ===== REDIS (for caching/sessions) =====
  redis:
    image: redis:7-alpine
    container_name: gozaride-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--append-only", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - gozaride_net

volumes:
  postgres_data: